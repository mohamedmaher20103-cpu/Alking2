name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ABO_KARDOOM_ONE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          mkdir -p /tmp/android-tools
          unzip -q tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/templates
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp -a /tmp/templates/templates/. ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Extract game
        run: |
          mkdir extracted
          unzip -q ABO_KARDOOM_ONE.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name project.godot -print -quit)")"
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure Godot Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF2
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF2

      - name: Import assets
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export APK
        run: |
          mkdir -p "$PROJECT_DIR/build"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path "$PROJECT_DIR" --export-release "Android" "$PROJECT_DIR/build/AboKardoom_TheLastKing.apk"
          test -s "$PROJECT_DIR/build/AboKardoom_TheLastKing.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AboKardoom-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/AboKardoom_TheLastKing.apk
